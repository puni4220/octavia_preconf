---
# tasks file for octavia_preconf

- name: import tasks for modifying the admin tenant quotas
  import_tasks: admin_tenant_quota_setup.yml
  tags:
    - always

- name: import tasks to create lb-mgmt-net for amphora
  import_tasks: octavia_lb_net_setup.yml
  tags:
    - always

- name: import tasks to create sec groups for amphora and health manager ports
  import_tasks: octavia_sec_group.yml
  tags:
    - always

- name: import tasks to create health mgr ports
  import_tasks: octavia_health_mgr_ports.yml
  tags:
    - always

- name: import tasks to create amphora image, flavor and ssh keypair
  import_tasks: octavia_amphora_keypair_image_flavor.yml
  tags:
    - always

- name: check if the octavia-certs secret exists
  shell:
    cmd: kubectl get secret -n openstack octavia-certs
  register: _check_octavia_secret
  ignore_errors: true
  tags:
    - octavia_cets

- block:
    - name: import tasks to create cert directories
      import_tasks: octavia_cert_dir_setup.yml
    - name: import tasks to create octavia certs
      import_tasks: octavia_cert.yml
  tags:
    - octavia_certs
  when:
    - "'not found' in _check_octavia_secret.stderr"

- block:
    - name: import tasks to force regenerate certs
      import_tasks: octavia_force_cert_regen.yml
  tags:
    - octavia_certs
  when:
    - "'octavia-certs' in _check_octavia_secret.stdout_lines[1]"
    - force_regen_certs == 'true'

- name: check if the amphora helm values file already exists
  stat:
    path: "{{ octavia_helm_values_file }}"
  register: _check_helm_values_file

- name: import tasks to create helm values file for amphora provider with if required
  include_tasks: octavia_helm_amphorae_values_nocerts.yml
  tags:
    - always
  when: not _check_helm_values_file.stat.exists

- name: Print a message with the filename of the helm overrides for amphora provider
  debug:
    msg: "{{ octavia_helm_values_file }} was created; include this file while installing octavia helm chart"
